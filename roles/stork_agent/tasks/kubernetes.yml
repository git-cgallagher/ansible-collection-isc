---
# Builds a sidecar for an EXISTING Kea pod template (this collection doesn't
# deploy Kea). Feed the two facts to your Kea role, for example:
#   kea_dhcp_k8s_extra_containers: "{{ stork_agent_k8s_containers }}"
#   kea_dhcp_k8s_extra_volumes:    "{{ stork_agent_k8s_volumes }}"
# The pod must also set shareProcessNamespace: true (see README).
- name: Build the Stork agent sidecar
  ansible.builtin.set_fact:
    stork_agent_k8s_containers:
      - name: stork-agent
        image: "{{ stork_agent_image }}"
        command: [sh, -c, "{{ lookup('ansible.builtin.template', 'k8s/sidecar-entrypoint.sh.j2') }}"]
        env: >-
          {{ [
               {'name': 'POD_IP', 'valueFrom': {'fieldRef': {'fieldPath': 'status.podIP'}}},
               {'name': 'POD_NAME', 'valueFrom': {'fieldRef': {'fieldPath': 'metadata.name'}}},
               {'name': 'AGENT_ADDRESS', 'value': stork_agent_k8s_address},
               {'name': 'REGISTER_SERVER_URL', 'value': stork_agent_server_url},
               {'name': 'STORK_AGENT_HOST', 'value': '0.0.0.0'},
               {'name': 'STORK_AGENT_PORT', 'value': stork_agent_port | string},
               {'name': 'STORK_AGENT_PROMETHEUS_KEA_EXPORTER_PORT', 'value': stork_agent_prometheus_kea_port | string},
               {'name': 'STORK_AGENT_PROMETHEUS_KEA_EXPORTER_PER_SUBNET_STATS',
                'value': stork_agent_prometheus_kea_per_subnet_stats | bool | lower},
               {'name': 'STORK_AGENT_SKIP_TLS_CERT_VERIFICATION', 'value': stork_agent_skip_tls_verify | bool | lower},
               {'name': 'STORK_AGENT_SERVER_TOKEN',
                'valueFrom': {'secretKeyRef': {'name': stork_agent_k8s_secret_name,
                                               'key': 'STORK_AGENT_SERVER_TOKEN', 'optional': true}}}
             ] + (stork_agent_extra_env | dict2items(key_name='name', value_name='value')) }}
        ports:
          - { name: stork-agent, containerPort: "{{ stork_agent_port | int }}", protocol: TCP }
          - { name: kea-metrics, containerPort: "{{ stork_agent_prometheus_kea_port | int }}", protocol: TCP }
        securityContext:
          allowPrivilegeEscalation: false
          # Reading the Kea container's /proc/<pid>/cwd needs ptrace. This is
          # above Pod Security "baseline": the namespace needs "privileged".
          capabilities: { drop: [ALL], add: [SYS_PTRACE, DAC_READ_SEARCH] }
        resources: "{{ stork_agent_k8s_resources }}"
        volumeMounts: "{{ stork_agent_k8s_volume_mounts + [{'name': 'stork-agent-state', 'mountPath': '/var/lib/stork-agent'}] }}"
    stork_agent_k8s_volumes:
      - { name: stork-agent-state, emptyDir: {} }

# The agent role usually runs before the Kea role, so Kea's namespace may not
# exist yet. Create it bare; the Kea role adds its own labels (e.g. Pod
# Security) when it applies the namespace later.
- name: Make sure Kea's namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ stork_agent_k8s_kubeconfig | default(omit, true) }}"
    context: "{{ stork_agent_k8s_context | default(omit, true) }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata: { name: "{{ stork_agent_k8s_namespace }}" }
  delegate_to: localhost
  become: false
  run_once: true
  when: stork_agent_k8s_manage_secret | bool and stork_agent_k8s_create_namespace | bool

- name: Store the registration token in a Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ stork_agent_k8s_kubeconfig | default(omit, true) }}"
    context: "{{ stork_agent_k8s_context | default(omit, true) }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ stork_agent_k8s_secret_name }}"
        namespace: "{{ stork_agent_k8s_namespace }}"
        labels: { app.kubernetes.io/managed-by: git_cgallagher.isc }
      stringData:
        STORK_AGENT_SERVER_TOKEN: "{{ _stork_agent_token }}"
  delegate_to: localhost
  become: false
  run_once: true
  when: stork_agent_k8s_manage_secret | bool
  no_log: true
