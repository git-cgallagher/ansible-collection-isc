---
# Debian 12/13, Ubuntu 22.04/24.04/26.04 — ISC .deb packages
_kea_pkg_format: deb
_kea_init: systemd
_kea_user: _kea
_kea_group: _kea
_kea_services:
  dhcp4: isc-kea-dhcp4-server
  dhcp6: isc-kea-dhcp6-server
  ddns: isc-kea-dhcp-ddns-server
_stork_agent_service: isc-stork-agent
_stork_server_service: isc-stork-server
_stork_agent_user: stork-agent
# No gnupg needed: apt reads ASCII-armoured .asc keyrings natively.
_kea_prereq_packages: [ca-certificates]
_stork_postgresql_packages: [postgresql, postgresql-contrib]
_stork_postgresql_service: postgresql
