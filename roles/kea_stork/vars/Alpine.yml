---
# Alpine 3.21+ — ISC .apk packages, OpenRC
_kea_pkg_format: apk
_kea_init: openrc
_kea_user: kea
_kea_group: kea
_kea_services:
  dhcp4: kea-dhcp4
  dhcp6: kea-dhcp6
  ddns: kea-dhcp-ddns
_stork_agent_service: isc-stork-agent
_stork_server_service: isc-stork-server
_stork_agent_user: stork-agent
_kea_prereq_packages: [ca-certificates]
_stork_postgresql_packages: [postgresql, postgresql-contrib]
_stork_postgresql_service: postgresql
