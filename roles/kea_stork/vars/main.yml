---
# Internal constants. Not meant to be overridden.
_kea_repo_name: "kea-{{ kea_branch }}{{ '-prv' if kea_cloudsmith_token | length > 0 else '' }}"
_kea_cloudsmith_repo_base: >-
  {{ kea_cloudsmith_base | replace('/public/', '/' ~ (kea_cloudsmith_token or 'public') ~ '/') }}

# Hooks are referenced by bare file name: Kea >= 2.7.9 only loads hooks from
# its compiled-in hooks dir, and accepts bare names, so one config renders
# identically on every distro and in the container images.
_kea_hook_lease_cmds: libdhcp_lease_cmds.so
_kea_hook_ha: libdhcp_ha.so

_kea_daemons:
  dhcp4:
    enabled: "{{ kea_dhcp4_enabled | bool }}"
    binary: kea-dhcp4
    conf: /etc/kea/kea-dhcp4.conf
    package: isc-kea-dhcp4
  dhcp6:
    enabled: "{{ kea_dhcp6_enabled | bool }}"
    binary: kea-dhcp6
    conf: /etc/kea/kea-dhcp6.conf
    package: isc-kea-dhcp6
  ddns:
    enabled: "{{ kea_ddns_enabled | bool }}"
    binary: kea-dhcp-ddns
    conf: /etc/kea/kea-dhcp-ddns.conf
    package: isc-kea-dhcp-ddns

_kea_supported_modes: [package, container, kubernetes]
_kea_ha_modes: [hot-standby, load-balancing, passive-backup]

# Cloudsmith's Alpine repos are signed with a per-repo RSA key whose file name
# carries its ID; the generic /rsa.key URL serves the PGP key instead, which
# apk rejects ("UNTRUSTED signature"). IDs read from each repo's
# setup.alpine.sh on 2026-10-27. Override with kea_apk_rsa_keys if ISC rotates.
_kea_apk_rsa_keys_default:
  kea-3-0: rsa.F10F3BFBD3D43C83.key
  kea-3-2: rsa.F66DAF918F7CAEB6.key
  kea-dev: rsa.74BF45C5BC52B8DD.key
  stork: rsa.6914F776A579B428.key
  stork-dev: rsa.BF2C56ECBA97B498.key
