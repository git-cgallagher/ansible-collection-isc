---
# RHEL / Rocky / Alma / Oracle 8-10, Fedora, Amazon Linux 2023 — ISC RPMs
_kea_pkg_format: rpm
_kea_init: systemd
_kea_user: kea
_kea_group: kea
_kea_services:
  dhcp4: kea-dhcp4
  dhcp6: kea-dhcp6
  ddns: kea-dhcp-ddns
_stork_agent_service: isc-stork-agent
_stork_server_service: isc-stork-server
_stork_agent_user: stork-agent
# shadow-utils MUST be installed in an earlier transaction than the Kea and
# Stork RPMs: their %pre scriptlets call groupadd/useradd. Minimal AL2023
# images lack it; in the same transaction Kea installs WITHOUT its user and
# the units (User=kea) then fail to start.
_kea_prereq_packages: [shadow-utils, ca-certificates]
_stork_postgresql_packages: [postgresql-server, postgresql-contrib]
_stork_postgresql_service: postgresql
