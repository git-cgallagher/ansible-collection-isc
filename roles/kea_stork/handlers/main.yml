---
# Config changes use reload (SIGHUP -> Kea config-reload, which also reloads
# hooks incl. HA) to avoid dropping in-flight packets. Package changes restart.
- name: Reload kea
  ansible.builtin.service:
    name: "{{ _kea_services[item.key] }}"
    state: "{{ 'reloaded' if _kea_init | default('systemd') == 'systemd' else 'restarted' }}"
  loop: "{{ _kea_daemons | dict2items | selectattr('value.enabled') | list }}"
  loop_control:
    label: "{{ _kea_services[item.key] }}"
  when: kea_service_state == 'started'

- name: Restart kea
  ansible.builtin.service:
    name: "{{ _kea_services[item.key] }}"
    state: restarted
  loop: "{{ _kea_daemons | dict2items | selectattr('value.enabled') | list }}"
  loop_control:
    label: "{{ _kea_services[item.key] }}"
  when: kea_service_state == 'started'

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart stork agent
  ansible.builtin.service:
    name: "{{ _stork_agent_service }}"
    state: restarted

- name: Restart stork server
  ansible.builtin.service:
    name: "{{ _stork_server_service }}"
    state: restarted
