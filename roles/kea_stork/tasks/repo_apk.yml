---
- name: Work out which ISC repos this host needs
  ansible.builtin.set_fact:
    _apk_repos: >-
      {{ ([_kea_repo_name] if ((kea_enabled | bool) and kea_deploy_mode == 'package') else [])
         + ([stork_repo] if ((stork_agent_enabled | bool) or (stork_server_enabled | bool)) else []) }}

- name: Fetch ISC apk signing keys
  ansible.builtin.get_url:
    url: "{{ _kea_cloudsmith_repo_base }}/{{ item }}/{{ _key }}"
    # apk picks the verification key by FILE NAME (from the index signature),
    # so it must be <repo>@isc-<KEYID>.rsa.pub exactly.
    dest: "/etc/apk/keys/{{ item }}@isc-{{ _key | regex_replace('^rsa\\.(.*)\\.key$', '\\1') }}.rsa.pub"
    mode: "0644"
  loop: "{{ _repos }}"
  vars:
    _key: "{{ (_kea_apk_rsa_keys_default | combine(kea_apk_rsa_keys | default({})))[item] }}"
    _repos: "{{ _apk_repos }}"

- name: Add ISC apk repositories
  ansible.builtin.lineinfile:
    path: /etc/apk/repositories
    line: >-
      {{ _kea_cloudsmith_repo_base }}/{{ item }}/alpine/v{{
         ansible_facts['distribution_version'].split('.')[0:2] | join('.') }}/main
  loop: "{{ _apk_repos }}"
  register: _kea_apk_repos

# Must run now (packages are installed next), not at a handler flush.
- name: Refresh apk index  # noqa: no-handler
  community.general.apk:
    update_cache: true
  when: _kea_apk_repos is changed
