---
- name: Set rendering inputs (host modes)
  ansible.builtin.set_fact:
    _peers: "{{ kea_ha_peers }}"
    _ip_key: address
    _this_name: "{{ kea_ha_this_server_name }}"
    _ha_self_url_any: false
    _control_address: "{{ kea_control_http_address }}"
    _dhcp4_socket_type: "{{ kea_dhcp4_socket_type }}"

- name: Create Kea directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ _kea_group }}"
    mode: "0750"
  loop:
    # /etc/kea is group-readable so the Stork agent (added to the Kea group)
    # can read the config — Stork needs it to discover control sockets.
    - { path: /etc/kea, owner: root }
    - { path: /etc/kea/tls, owner: root }
    - { path: /var/lib/kea, owner: "{{ _kea_user }}" }
    - { path: /var/log/kea, owner: "{{ _kea_user }}" }
    - { path: "{{ kea_control_unix_socket_dir }}", owner: "{{ _kea_user }}" }

- name: Copy TLS material
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: "{{ _kea_group }}"
    mode: "{{ item.mode | default('0640') }}"
  loop: "{{ kea_tls_files }}"
  no_log: "{{ item.dest is search('key') }}"
  notify: Reload kea

- name: Render Kea configuration
  ansible.builtin.template:
    src: "{{ 'kea-dhcp-ddns.conf.j2' if item.key == 'ddns' else 'kea-dhcp.conf.j2' }}"
    dest: "{{ item.value.conf }}"
    owner: root
    group: "{{ _kea_group }}"
    mode: "0640"
    validate: "{{ _validate[kea_deploy_mode] }}"
  vars:
    _family: "{{ item.key | replace('dhcp', '') }}"
    _validate:
      package: "{{ item.value.binary }} -t %s"
      container: >-
        {{ _kea_runtime | default('') }} run --rm --network none
        --user 0:{{ kea_image_kea_gid }} --cap-drop ALL --cap-add NET_BIND_SERVICE --cap-add NET_RAW
        -v /etc/kea:/etc/kea:ro -v %s:/tmp/candidate.conf:ro
        {{ _kea_images[item.key] | default('') }} {{ item.value.binary }} -t /tmp/candidate.conf
  loop: "{{ _kea_daemons | dict2items | selectattr('value.enabled') | list }}"
  loop_control:
    label: "{{ item.value.conf }}"
  notify: Reload kea

- name: Stop services of disabled daemons
  ansible.builtin.service:
    name: "{{ _kea_services[item.key] }}"
    state: stopped
    enabled: false
  loop: "{{ _kea_daemons | dict2items | rejectattr('value.enabled') | list }}"
  loop_control:
    label: "{{ item.key }}"
  failed_when: false

- name: Enable and start Kea services
  ansible.builtin.service:
    name: "{{ _kea_services[item.key] }}"
    state: "{{ kea_service_state }}"
    enabled: "{{ kea_service_enabled }}"
  loop: "{{ _kea_daemons | dict2items | selectattr('value.enabled') | list }}"
  loop_control:
    label: "{{ _kea_services[item.key] }}"

- name: Flush handlers so Kea is running before the Stork agent registers
  ansible.builtin.meta: flush_handlers

- name: Wait for the Kea control API
  ansible.builtin.uri:
    url: "{{ 'https' if kea_control_tls else 'http' }}://{{ _ctrl_host }}:{{ item.port }}/"
    method: POST
    body_format: json
    body: { command: status-get }
    validate_certs: false
    status_code: [200]
  vars:
    _ctrl_host: "{{ '127.0.0.1' if kea_control_http_address in ['0.0.0.0', '::'] else kea_control_http_address }}"
  loop:
    - { name: dhcp4, port: "{{ kea_dhcp4_control_port }}", active: "{{ kea_dhcp4_enabled | bool }}" }
    - { name: dhcp6, port: "{{ kea_dhcp6_control_port }}", active: "{{ kea_dhcp6_enabled | bool }}" }
  loop_control:
    label: "{{ item.name }}"
  when: item.active | bool and kea_service_state == 'started' and not kea_control_tls.cert_required | default(false)
  register: _kea_status
  until: _kea_status.status == 200
  retries: 15
  delay: 2
