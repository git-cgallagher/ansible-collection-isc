---
# Everything here runs once, on the control node, against the cluster API.
- name: Kubernetes deployment
  run_once: true
  delegate_to: localhost
  become: false
  vars:
    _k8s_auth: &k8s_auth
      kubeconfig: "{{ kea_k8s_kubeconfig | default(omit, true) }}"
      context: "{{ kea_k8s_context | default(omit, true) }}"
    _peers_k8s: >-
      {{ kea_k8s_peers if (kea_ha_enabled | bool)
         else [{'name': kea_k8s_single_replica_name, 'cluster_ip': (kea_k8s_peers[0].cluster_ip | default('')), 'role': 'primary'}] }}
    _stork_sidecar: "{{ stork_agent_enabled | bool }}"
    _psa: >-
      {{ kea_k8s_pod_security if kea_k8s_pod_security | length > 0
         else ('privileged' if (kea_k8s_exposure == 'hostnetwork' or _stork_sidecar) else 'baseline') }}
  block:
    - name: Set rendering inputs (Kubernetes)
      ansible.builtin.set_fact:
        _peers: "{{ _peers_k8s }}"
        _ip_key: cluster_ip
        # A pod can't bind its Service ClusterIP, and Kea binds the HA
        # listener to the host in its OWN peer URL — so each pod's own URL is
        # 0.0.0.0 and only the partner's is the pinned ClusterIP. Verified
        # with Kea 3.0.4: asymmetric URLs pair up fine.
        _ha_self_url_any: true
        _control_address: 127.0.0.1
        # Pods never see L2 broadcasts: relayed traffic only.
        _dhcp4_socket_type: udp
        _kea_k8s_psa: "{{ _psa }}"
        _kea_k8s_labels:
          app.kubernetes.io/name: kea
          app.kubernetes.io/managed-by: ansible-kea_stork

    - name: Render shared manifests
      ansible.builtin.set_fact:
        _kea_k8s_docs: >-
          {{ (lookup('ansible.builtin.template', 'k8s/namespace.yaml.j2') | from_yaml_all | list)
             + (lookup('ansible.builtin.template', 'k8s/stork-server.yaml.j2') | from_yaml_all | list)
             + (lookup('ansible.builtin.template', 'k8s/networkpolicy.yaml.j2') | from_yaml_all | list) }}

    - name: Render per-peer manifests
      ansible.builtin.set_fact:
        _kea_k8s_peer_docs: >-
          {{ _kea_k8s_peer_docs | default({})
             | combine({_peer.name: lookup('ansible.builtin.template', 'k8s/peer.yaml.j2') | from_yaml_all | select | list}) }}
      loop: "{{ _peers }}"
      loop_control:
        loop_var: _peer
        label: "{{ _peer.name }}"

    - name: Write rendered manifests for review / GitOps
      when: kea_k8s_render_dir | length > 0
      block:
        - name: Create render dir
          ansible.builtin.file:
            path: "{{ kea_k8s_render_dir }}"
            state: directory
            mode: "0755"

        - name: Write shared manifests
          ansible.builtin.copy:
            dest: "{{ kea_k8s_render_dir }}/00-shared.yaml"
            # Every document starts with '---' so files can be concatenated.
            content: "{{ _kea_k8s_docs | select | map('to_nice_yaml', indent=2) | map('regex_replace', '^', '---\n') | join('') }}"
            mode: "0644"

        - name: Write per-peer manifests
          ansible.builtin.copy:
            dest: "{{ kea_k8s_render_dir }}/10-{{ item.key }}.yaml"
            content: "{{ item.value | map('to_nice_yaml', indent=2) | map('regex_replace', '^', '---\n') | join('') }}"
            mode: "0644"
          loop: "{{ _kea_k8s_peer_docs | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

    - name: Apply shared objects (namespace, Stork server, policy)
      kubernetes.core.k8s:
        <<: *k8s_auth
        state: "{{ kea_k8s_state }}"
        definition: "{{ item }}"
        apply: true
        server_side_apply: { field_manager: kea_stork }
      loop: "{{ _kea_k8s_docs | select | list }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name }}"
      when: (kea_k8s_apply | bool) and kea_k8s_state == 'present'

    - name: Wait for the in-cluster Stork server
      kubernetes.core.k8s_info:
        <<: *k8s_auth
        kind: Pod
        namespace: "{{ kea_k8s_namespace }}"
        label_selectors: [app.kubernetes.io/name=stork-server]
        wait: true
        wait_condition: { type: Ready, status: "True" }
        wait_timeout: 300
      when: (kea_k8s_apply | bool) and kea_k8s_state == 'present' and (kea_k8s_stork_server_enabled | bool)

    # After the server exists: an in-cluster server can only answer now.
    # stork_api_url must be reachable from the control node (port-forward,
    # ingress, or LoadBalancer).
    - name: Rotate the in-cluster Stork bootstrap admin password
      ansible.builtin.include_tasks: _stork_rotate_admin.yml
      vars:
        _api: "{{ stork_api_url | regex_replace('/$', '') }}/api"
      when: kea_k8s_state == 'present' and (kea_k8s_stork_server_enabled | bool) and (kea_k8s_apply | bool)

    - name: Fetch the Stork server token from the API
      ansible.builtin.include_tasks: _stork_api_token.yml
      when:
        - kea_k8s_state == 'present'
        - kea_k8s_apply | bool
        - stork_agent_enabled | bool
        - stork_server_token | length == 0 and stork_admin_password | length > 0

    - name: Apply the Stork agent token Secret
      kubernetes.core.k8s:
        <<: *k8s_auth
        state: "{{ kea_k8s_state }}"
        definition: "{{ lookup('ansible.builtin.template', 'k8s/stork-agent-secret.yaml.j2') | from_yaml }}"
        apply: "{{ kea_k8s_state == 'present' }}"
      when: (kea_k8s_apply | bool) and (stork_agent_enabled | bool)
      no_log: true

    # One peer at a time, waiting for readiness, so a config change never
    # restarts both HA partners at once.
    - name: Apply HA peers one at a time
      ansible.builtin.include_tasks: _k8s_apply_peer.yml
      loop: "{{ _peers | map(attribute='name') | list }}"
      loop_control:
        loop_var: _peer_name
      when: (kea_k8s_apply | bool)

    - name: Remove shared objects
      kubernetes.core.k8s:
        <<: *k8s_auth
        state: absent
        definition: "{{ item }}"
      loop: "{{ _kea_k8s_docs | select | reverse | list }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name }}"
      when: (kea_k8s_apply | bool) and kea_k8s_state == 'absent'
