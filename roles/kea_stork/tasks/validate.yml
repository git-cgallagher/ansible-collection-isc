---
- name: Check deploy mode
  ansible.builtin.assert:
    that: kea_deploy_mode in _kea_supported_modes
    fail_msg: "kea_deploy_mode must be one of {{ _kea_supported_modes }}"
    quiet: true

- name: Check HA settings
  when: (kea_ha_enabled | bool) and (kea_enabled | bool)
  vars:
    _peers: "{{ kea_k8s_peers if kea_deploy_mode == 'kubernetes' else kea_ha_peers }}"
    _ip_key: "{{ 'cluster_ip' if kea_deploy_mode == 'kubernetes' else 'address' }}"
    _roles: "{{ _peers | map(attribute='role') | list }}"
  ansible.builtin.assert:
    that:
      - kea_ha_mode in _kea_ha_modes
      - _peers | length >= 2
      - _peers | map(attribute='name') | unique | list | length == _peers | length
      # Kea does not resolve names in HA URLs — IP literals only.
      - _peers | map(attribute=_ip_key) | map('string') | reject('match', '^([0-9]{1,3}\\.){3}[0-9]{1,3}$|^[0-9a-fA-F:]*:[0-9a-fA-F:.]*$') | list | length == 0
      - _roles | select('eq', 'primary') | list | length == 1
      - kea_ha_mode != 'hot-standby' or (_roles | select('eq', 'standby') | list | length == 1)
      - kea_ha_mode != 'load-balancing' or (_roles | select('eq', 'secondary') | list | length == 1)
      - kea_ha_mode != 'passive-backup' or (_roles | reject('in', ['primary', 'backup']) | list | length == 0)
      - kea_deploy_mode == 'kubernetes' or kea_ha_this_server_name in (_peers | map(attribute='name'))
      - kea_ha_tls | length == 0 or (['trust_anchor', 'cert_file', 'key_file'] | difference(kea_ha_tls.keys()) | length == 0)
    fail_msg: >-
      HA config invalid. Need >=2 uniquely-named peers with IP-literal
      {{ _ip_key }} (Kea won't resolve hostnames in HA URLs), exactly one
      primary, the partner role matching kea_ha_mode ({{ kea_ha_mode }}),
      this host's name ({{ kea_ha_this_server_name }}) among the peers, and
      kea_ha_tls with all of trust_anchor/cert_file/key_file or none.
    quiet: true

- name: Check DHCPv4 subnets carry explicit ids
  when: (kea_enabled | bool) and (kea_dhcp4_enabled | bool)
  ansible.builtin.assert:
    that: kea_dhcp4_subnets | selectattr('id', 'undefined') | list | length == 0
    fail_msg: >-
      Every kea_dhcp4_subnets entry needs an explicit `id`. HA peers must agree
      on subnet ids, and auto-assigned ids depend on list order.
    quiet: true

- name: Check DHCPv6 subnets carry explicit ids
  when: (kea_enabled | bool) and (kea_dhcp6_enabled | bool)
  ansible.builtin.assert:
    that: kea_dhcp6_subnets | selectattr('id', 'undefined') | list | length == 0
    fail_msg: Every kea_dhcp6_subnets entry needs an explicit `id`.
    quiet: true

- name: Check Stork agent settings
  when: (stork_agent_enabled | bool) and (kea_enabled | bool)
  ansible.builtin.assert:
    that:
      - stork_server_url | length > 0
      - kea_deploy_mode == 'package' or stork_agent_image | length > 0
    fail_msg: >-
      stork_agent_enabled needs stork_server_url, and in container/kubernetes
      mode stork_agent_image — ISC publishes no Stork image; build
      files/Dockerfile.stork-agent (it bundles the Kea binaries the agent
      runs to identify daemons).
    quiet: true

- name: Check Stork server settings
  when: (stork_server_enabled | bool) or (kea_deploy_mode == 'kubernetes' and (kea_k8s_stork_server_enabled | bool))
  ansible.builtin.assert:
    that:
      - stork_db_password | length > 0
      - kea_deploy_mode != 'kubernetes' or stork_server_image | length > 0
      - kea_deploy_mode != 'kubernetes' or stork_db_host not in ['localhost', '127.0.0.1']
    fail_msg: >-
      Stork server needs stork_db_password (vault it). In Kubernetes it also
      needs stork_server_image and an external stork_db_host.
    quiet: true

- name: Check Kubernetes settings
  when: kea_deploy_mode == 'kubernetes'
  ansible.builtin.assert:
    that:
      - kea_k8s_profile in ['generic', 'eks', 'talos']
      - kea_k8s_exposure in ['loadbalancer', 'hostnetwork', 'none']
      - (kea_ha_enabled | bool) or kea_k8s_peers | length <= 1
    fail_msg: Unsupported kea_k8s_profile / kea_k8s_exposure, or peers without HA.
    quiet: true
