---
- name: "Apply peer {{ _peer_name }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ kea_k8s_kubeconfig | default(omit, true) }}"
    context: "{{ kea_k8s_context | default(omit, true) }}"
    state: "{{ kea_k8s_state }}"
    definition: "{{ item }}"
    apply: "{{ kea_k8s_state == 'present' }}"
    server_side_apply: "{{ {'field_manager': 'kea_stork'} if kea_k8s_state == 'present' else omit }}"
    wait: "{{ item.kind == 'StatefulSet' and kea_k8s_state == 'present' }}"
    wait_timeout: 300
  loop: "{{ _kea_k8s_peer_docs[_peer_name] }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: "Wait for the pod to be ready: {{ _peer_name }}"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kea_k8s_kubeconfig | default(omit, true) }}"
    context: "{{ kea_k8s_context | default(omit, true) }}"
    kind: Pod
    namespace: "{{ kea_k8s_namespace }}"
    label_selectors: ["kea.isc.org/peer={{ _peer_name }}"]
    wait: true
    wait_condition: { type: Ready, status: "True" }
    wait_timeout: 300
  run_once: true
  delegate_to: localhost
  become: false
  when: kea_k8s_state == 'present'
