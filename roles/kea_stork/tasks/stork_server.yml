---
- name: Local PostgreSQL for Stork
  ansible.builtin.include_tasks: stork_postgresql.yml
  when: (stork_db_install_local | bool)

- name: Install the Stork server
  ansible.builtin.package:
    name: "isc-stork-server{{ _ver }}"
    state: present
  vars:
    _ver: >-
      {{ '' if stork_version | length == 0
         else {'deb': '=', 'rpm': '-', 'apk': '~'}[_kea_pkg_format] ~ stork_version ~ ('*' if _kea_pkg_format in ['deb', 'rpm'] else '') }}
  notify: Restart stork server

- name: Write server.env (contains the DB password)
  ansible.builtin.template:
    src: server.env.j2
    dest: /etc/stork/server.env
    owner: root
    group: stork-server
    mode: "0640"
  no_log: true
  notify: Restart stork server

- name: Enable and start the Stork server
  ansible.builtin.service:
    name: "{{ _stork_server_service }}"
    state: started
    enabled: true

- name: Apply pending restarts before probing the API
  ansible.builtin.meta: flush_handlers

- name: Wait for the Stork REST API
  ansible.builtin.uri:
    url: "{{ 'https' if stork_server_tls else 'http' }}://127.0.0.1:{{ stork_server_rest_port }}/api/version"
    validate_certs: false
  register: _stork_version
  until: _stork_version.status == 200
  retries: 30
  delay: 2

# Stork's first boot creates admin/admin. If you supplied a real password,
# rotate the bootstrap one so the UI is never left on the default.
- name: Rotate the bootstrap admin password
  when: stork_admin_password | length > 0 and stork_admin_password != stork_admin_bootstrap_password
  vars:
    _api: "{{ 'https' if stork_server_tls else 'http' }}://127.0.0.1:{{ stork_server_rest_port }}/api"
  block:
    - name: Try the bootstrap credentials
      ansible.builtin.uri:
        url: "{{ _api }}/sessions"
        method: POST
        body_format: json
        body: { authenticationMethodId: internal, identifier: "{{ stork_admin_user }}", secret: "{{ stork_admin_bootstrap_password }}" }
        validate_certs: false
        status_code: [200, 400, 401, 403]
      register: _stork_boot_login
      no_log: true

    - name: Set the real admin password
      ansible.builtin.uri:
        url: "{{ _api }}/users/{{ _stork_boot_login.json.id }}/password"
        method: PUT
        body_format: json
        body: { oldpassword: "{{ stork_admin_bootstrap_password }}", newpassword: "{{ stork_admin_password }}" }
        headers: { Cookie: "{{ _stork_boot_login.cookies_string }}" }
        validate_certs: false
      when: _stork_boot_login.status == 200
      changed_when: true
      no_log: true
