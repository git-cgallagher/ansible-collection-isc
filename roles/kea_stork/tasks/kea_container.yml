---
# Kea under podman/docker with a plain systemd unit per daemon. Works on any
# systemd host that can run containers. Paths inside the container are kept
# identical to the host (/etc/kea, /var/lib/kea, /var/run/kea, /var/log/kea)
# so a Stork agent reading /proc/<pid>/cmdline finds the same config path.
- name: Detect container runtime
  ansible.builtin.shell: |
    set -e
    for r in {{ (['podman', 'docker'] if kea_container_runtime == 'auto' else [kea_container_runtime]) | join(' ') }}; do
      if command -v "$r" >/dev/null 2>&1; then command -v "$r"; exit 0; fi
    done
    exit 1
  args:
    executable: /bin/sh
  register: _kea_runtime_probe
  changed_when: false
  failed_when: false

- name: Install podman
  ansible.builtin.package:
    name: podman
    state: present
  when: _kea_runtime_probe.rc != 0 and (kea_container_install_runtime | bool)

- name: Re-detect runtime after install
  ansible.builtin.command: sh -c 'command -v podman'
  register: _kea_runtime_probe2
  changed_when: false
  when: _kea_runtime_probe.rc != 0 and (kea_container_install_runtime | bool)

- name: Require a container runtime
  ansible.builtin.assert:
    that: _kea_runtime_probe.rc == 0 or (_kea_runtime_probe2.rc | default(1)) == 0
    fail_msg: >-
      No container runtime ({{ kea_container_runtime }}) found. Install podman
      or docker, or set kea_container_install_runtime: true.
    quiet: true

- name: Set container-mode facts
  ansible.builtin.set_fact:
    _kea_runtime: "{{ (_kea_runtime_probe.stdout if _kea_runtime_probe.rc == 0 else _kea_runtime_probe2.stdout) | trim }}"
    _kea_init: systemd
    # The ISC images run Kea as root; host-side files are root-owned.
    _kea_user: root
    _kea_group: root
    _kea_services: { dhcp4: kea-dhcp4, dhcp6: kea-dhcp6, ddns: kea-dhcp-ddns }
    _kea_images: { dhcp4: "{{ kea_dhcp4_image }}", dhcp6: "{{ kea_dhcp6_image }}", ddns: "{{ kea_ddns_image }}" }

- name: Warn about the amd64-only ISC image on arm64 hosts
  ansible.builtin.debug:
    msg: >-
      ISC's Kea images are amd64-only. This host is {{ ansible_facts['architecture'] }}:
      build files/Dockerfile.kea and set kea_image_registry / kea_*_image.
  when:
    - ansible_facts['architecture'] in ['aarch64', 'arm64']
    - kea_image_registry is search('cloudsmith.io/isc')

- name: Pull Kea images
  ansible.builtin.command: "{{ _kea_runtime }} pull {{ _kea_images[item.key] }}"
  loop: "{{ _kea_daemons | dict2items | selectattr('value.enabled') | list }}"
  loop_control:
    label: "{{ _kea_images[item.key] }}"
  register: _kea_pull
  when: kea_container_pull | bool
  changed_when: "'Downloaded newer image' in _kea_pull.stdout or 'Writing manifest' in _kea_pull.stderr"

- name: Install systemd units for Kea containers
  ansible.builtin.template:
    src: kea-container.service.j2
    dest: "/etc/systemd/system/{{ _kea_services[item.key] }}.service"
    owner: root
    group: root
    mode: "0644"
  vars:
    _daemon: "{{ item.value.binary }}"
    _image: "{{ _kea_images[item.key] }}"
    _conf: "{{ item.value.conf }}"
  loop: "{{ _kea_daemons | dict2items | selectattr('value.enabled') | list }}"
  loop_control:
    label: "{{ _kea_services[item.key] }}"
  notify: [Reload systemd, Restart kea]

- name: Reload systemd now so the units exist before they are started
  ansible.builtin.meta: flush_handlers
