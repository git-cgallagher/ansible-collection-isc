---
- name: Validate inputs
  ansible.builtin.import_tasks: validate.yml
  tags: [kea, stork, always]

- name: Kubernetes deployment (runs against the cluster, not the host)
  ansible.builtin.include_tasks: kubernetes.yml
  when: kea_deploy_mode == 'kubernetes'
  tags: [kea, stork, k8s]

- name: Host deployment (package / container)
  when: kea_deploy_mode != 'kubernetes'
  block:
    - name: Load platform facts
      ansible.builtin.include_tasks: platform.yml
      tags: [kea, stork]

    - name: Configure ISC package repositories
      ansible.builtin.include_tasks: "repo_{{ _kea_pkg_format }}.yml"
      when: >-
        ((kea_enabled | bool) and kea_deploy_mode == 'package')
        or (stork_agent_enabled | bool) or (stork_server_enabled | bool)
      tags: [kea, stork, repo]

    - name: Stork server
      ansible.builtin.include_tasks: stork_server.yml
      when: (stork_server_enabled | bool)
      tags: [stork, stork_server]

    - name: Kea from packages
      ansible.builtin.include_tasks: kea_package.yml
      when: (kea_enabled | bool) and kea_deploy_mode == 'package'
      tags: [kea]

    - name: Kea in containers
      ansible.builtin.include_tasks: kea_container.yml
      when: (kea_enabled | bool) and kea_deploy_mode == 'container'
      tags: [kea]

    - name: Kea configuration
      ansible.builtin.include_tasks: kea_config.yml
      when: (kea_enabled | bool)
      tags: [kea, kea_config]

    - name: Stork agent
      ansible.builtin.include_tasks: stork_agent.yml
      when: (stork_agent_enabled | bool) and (kea_enabled | bool)
      tags: [stork, stork_agent]
