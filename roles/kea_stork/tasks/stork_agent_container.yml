---
- name: Require a Stork agent image
  ansible.builtin.assert:
    that: stork_agent_image | length > 0
    fail_msg: >-
      With Kea in a container the Stork agent must run in one too. ISC
      publishes no Stork image: build files/Dockerfile.stork-agent and set
      stork_agent_image.
    quiet: true

- name: Create Stork agent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop: [/etc/stork, /var/lib/stork-agent]

- name: Write agent.env
  ansible.builtin.template:
    src: agent.env.j2
    dest: /etc/stork/agent.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart stork agent

- name: Check whether the agent is already registered
  ansible.builtin.stat:
    path: /var/lib/stork-agent/root-cert.pem
  register: _stork_agent_ca

- name: Pull the Stork agent image
  ansible.builtin.command: "{{ _kea_runtime }} pull {{ stork_agent_image }}"
  register: _stork_pull
  changed_when: "'Downloaded newer image' in _stork_pull.stdout or 'Writing manifest' in _stork_pull.stderr"
  when: kea_container_pull | bool

- name: Register the agent with the Stork server
  ansible.builtin.command:
    argv: >-
      {{ [_kea_runtime, 'run', '--rm', '--network', 'host',
          '-v', '/var/lib/stork-agent:/var/lib/stork-agent',
          stork_agent_image, 'stork-agent', 'register', '--non-interactive',
          '--server-url', stork_server_url,
          '--agent-host', stork_agent_address,
          '--agent-port', stork_agent_port | string]
         + (['--server-token', _token] if _token | length > 0 else [])
         + (['--skip-tls-cert-verification'] if (stork_agent_skip_tls_verify | bool) else []) }}
  vars:
    _token: "{{ stork_server_token or (_stork_fetched_token | default('')) }}"
  when: not _stork_agent_ca.stat.exists
  changed_when: true
  no_log: "{{ _token | length > 0 }}"
  notify: Restart stork agent

- name: Install the Stork agent unit
  ansible.builtin.template:
    src: stork-agent-container.service.j2
    dest: /etc/systemd/system/isc-stork-agent.service
    owner: root
    group: root
    mode: "0644"
  notify: [Reload systemd, Restart stork agent]

- name: Apply unit changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start the Stork agent
  ansible.builtin.systemd_service:
    name: isc-stork-agent
    state: started
    enabled: true
