---
- name: Add EPEL repo restricted to log4cplus
  ansible.builtin.yum_repository:
    name: epel-log4cplus
    description: "EPEL {{ _kea_epel_release }} (log4cplus only, for ISC Kea)"
    baseurl: "https://dl.fedoraproject.org/pub/epel/{{ _kea_epel_release }}/Everything/$basearch/"
    gpgkey: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ _kea_epel_release }}"
    gpgcheck: true
    includepkgs: [log4cplus]
    enabled: true
  when:
    - (kea_enabled | bool) and kea_deploy_mode == 'package'
    - _kea_epel_release | length > 0
    - ansible_facts['distribution'] != 'Amazon' or (kea_al2023_epel_log4cplus | bool)

- name: Add ISC Cloudsmith repositories (rpm)
  ansible.builtin.yum_repository:
    name: "isc-{{ item }}"
    description: "ISC {{ item }} ({{ _kea_rpm_distro }}/{{ _kea_rpm_release }})"
    baseurl: "{{ _kea_cloudsmith_repo_base }}/{{ item }}/rpm/{{ _kea_rpm_distro }}/{{ _kea_rpm_release }}/$basearch"
    gpgkey: "{{ _kea_cloudsmith_repo_base }}/{{ item }}/gpg.key"
    gpgcheck: true
    repo_gpgcheck: true
    enabled: true
    sslverify: true
    metadata_expire: "300"
  loop: >-
    {{ ([_kea_repo_name] if ((kea_enabled | bool) and kea_deploy_mode == 'package') else [])
       + ([stork_repo] if ((stork_agent_enabled | bool) or (stork_server_enabled | bool)) else []) }}
