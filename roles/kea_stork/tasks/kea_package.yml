---
- name: Gather installed packages
  ansible.builtin.package_facts:

- name: Remove kea-ctrl-agent (deprecated in 3.0, removed in 3.2; this role never uses it)
  ansible.builtin.package:
    name: isc-kea-ctrl-agent
    state: absent
  when: "'isc-kea-ctrl-agent' in ansible_facts.packages"

- name: Install Kea packages
  ansible.builtin.package:
    name: "{{ _pinned }}"
    state: present
  vars:
    _pkgs: >-
      {{ ['isc-kea-common', 'isc-kea-hooks']
         + (_kea_daemons | dict2items | selectattr('value.enabled') | map(attribute='value.package') | list)
         + (['isc-kea-mysql'] if kea_lease_backend == 'mysql' else [])
         + (['isc-kea-pgsql'] if kea_lease_backend == 'postgresql' else []) }}
    # apt: pkg=3.0.4*   dnf: pkg-3.0.4*   apk: pkg~3.0.4  (Stork's RPM version is 2.6.0.<build>)
    _sep: "{{ {'deb': '=', 'rpm': '-', 'apk': '~'}[_kea_pkg_format] }}"
    _suffix: "{{ '*' if _kea_pkg_format in ['deb', 'rpm'] else '' }}"
    _pinned: >-
      {{ _pkgs if kea_version | length == 0
         else _pkgs | map('regex_replace', '$', _sep ~ kea_version ~ _suffix) | list }}
  notify: Restart kea

# The ISC RPM %pre scriptlet creates the user only if groupadd/useradd exist
# at that moment. platform.yml installs shadow-utils first, but a host that
# was half-installed earlier can still be missing the user — make it certain.
- name: Ensure the Kea service group exists
  ansible.builtin.group:
    name: "{{ _kea_group }}"
    system: true

- name: Ensure the Kea service user exists
  ansible.builtin.user:
    name: "{{ _kea_user }}"
    group: "{{ _kea_group }}"
    system: true
    shell: /sbin/nologin
    home: /var/lib/kea
    create_home: false
