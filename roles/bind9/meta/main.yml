---
galaxy_info:
  role_name: bind9
  author: Chris Gallagher
  description: >-
    ISC BIND 9 as an authoritative DNS server from the distro's packages:
    zones, TSIG keys, GSS-TSIG keytab and update policies, ready to take
    Kea's dynamic DNS updates.
  license: MIT
  min_ansible_version: "2.16"
  platforms:
    - name: Alpine
      versions: [all]
    - name: Debian
      versions: [bookworm, trixie]
    - name: Ubuntu
      versions: [jammy, noble]
    - name: EL
      versions: ["9", "10"]
    - name: Fedora
      versions: [all]
    - name: Amazon Linux
      versions: ["2023"]
  galaxy_tags: [bind, bind9, dns, ddns, tsig, isc]
dependencies: []
