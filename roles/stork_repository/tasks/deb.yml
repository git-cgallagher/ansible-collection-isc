---
- name: Refresh the apt cache (minimal images ship without one)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install CA certificates
  ansible.builtin.apt:
    name: ca-certificates
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# apt reads ASCII-armoured .asc keyrings directly; no gnupg needed.
- name: Fetch the repository signing key
  ansible.builtin.get_url:
    url: "{{ _stork_repository_url }}/gpg.key"
    dest: "/etc/apt/keyrings/isc-{{ stork_repository_name }}.asc"
    mode: "0644"

- name: Add the apt source
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/isc-{{ stork_repository_name }}.asc]
      {{ _stork_repository_url }}/deb/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} main
    filename: "isc-{{ stork_repository_name }}"
    state: present
    update_cache: true
