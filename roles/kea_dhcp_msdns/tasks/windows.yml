---
# Windows AD DC backend. The account and the zones are desired state for
# microsoft.ad.user and ansible.windows.win_dns_zone (check mode, diff and
# idempotency come from the modules; the password is no_log in the module).
# Only ktpass stays a script: it is a binary that takes the password on its
# command line (no_log hides it from Ansible output; it is briefly visible in
# the DC's process list).

# AD only issues tickets to a UPN: it must equal the client principal.
# update_password: on_create is deliberate. The default (always) would reset
# the password on every run, which bumps the account's key version and
# invalidates the keytab already deployed to Kea. ktpass sets it when a keytab
# is produced.
# identity finds the account by sAMAccountName wherever it is; without it the
# module only looks at CN=<name> under path, and an account that already
# exists elsewhere would be created a second time (and fail). With identity,
# an account outside path is moved there.
- name: Ensure the service account, UPN and SPN
  microsoft.ad.user:
    identity: "{{ kea_dhcp_msdns_service_account }}"
    name: "{{ kea_dhcp_msdns_service_account }}"
    sam_account_name: "{{ kea_dhcp_msdns_service_account }}"
    path: "{{ kea_dhcp_msdns_service_account_ou | default(omit, true) }}"
    upn: "{{ kea_dhcp_msdns_client_principal }}"
    spn:
      add: ["{{ kea_dhcp_msdns__spn }}"]
    password: "{{ kea_dhcp_msdns_service_account_password }}"
    update_password: on_create
    password_never_expires: true
    enabled: true
    description: ISC Kea DHCP dynamic DNS updates (GSS-TSIG)
    # The whole argument is conditional: omit on the suboption alone would
    # send groups: {} rather than no groups argument.
    groups: "{{ {'add': ['DnsUpdateProxy']} if kea_dhcp_msdns_dnsupdateproxy | bool else omit }}"
    state: present

# The module's choices are lower case; the role keeps the PowerShell casing
# (Secure, NonsecureAndSecure, Domain, ...) in its argument spec. replication is
# desired state for existing zones too: win_dns_zone sets it on every run, so an
# AD-integrated zone with another scope is converted, and a file-backed zone
# fails (the module refuses that conversion).
- name: Ensure the zones exist with secure dynamic updates
  ansible.windows.win_dns_zone:
    name: "{{ item | regex_replace('\\.$', '') }}"
    type: primary
    replication: "{{ kea_dhcp_msdns_zone_replication | lower }}"
    dynamic_update: "{{ kea_dhcp_msdns_dynamic_update | lower }}"
    state: present
  loop: "{{ kea_dhcp_msdns_forward_zones + kea_dhcp_msdns_reverse_zones }}"

- name: Produce and fetch the keytab
  when: kea_dhcp_msdns__make_keytab | bool
  block:
    - name: Create a temporary path on the DC
      ansible.windows.win_tempfile:
        state: file
        suffix: .keytab
      register: kea_dhcp_msdns__wtmp

    # ktpass maps the principal onto the account (UPN), sets its password and
    # writes the keytab. It bumps the key version: earlier keytabs stop working.
    # In check mode win_powershell skips the script (it declares no
    # SupportsShouldProcess) and reports changed.
    - name: Generate the keytab with ktpass
      ansible.windows.win_powershell:
        parameters:
          Principal: "{{ kea_dhcp_msdns_client_principal }}"
          MapUser: "{{ kea_dhcp_msdns_netbios_domain }}\\{{ kea_dhcp_msdns_service_account }}"
          Password: "{{ kea_dhcp_msdns_service_account_password }}"
          Crypto: "{{ kea_dhcp_msdns_keytab_crypto }}"
          Out: "{{ kea_dhcp_msdns__wtmp.path }}"
        script: |
          param($Principal, $MapUser, $Password, $Crypto, $Out)
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath $Out -Force -ErrorAction SilentlyContinue
          # ktpass writes progress to stderr; with 'Stop', Windows PowerShell
          # 5.1 would turn its first line into a terminating error.
          $ErrorActionPreference = 'Continue'
          $log = & ktpass.exe -princ $Principal -mapuser $MapUser -pass $Password -mapop set `
              -ptype KRB5_NT_PRINCIPAL -crypto $Crypto -out $Out 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $Out)) {
              throw "ktpass failed ($LASTEXITCODE): $($log.Replace($Password, '********'))"
          }
          $Ansible.Changed = $true
      # no_log would also censor the error; it is reported by the next task.
      register: kea_dhcp_msdns__ktpass
      failed_when: false
      no_log: true

    - name: Report a ktpass failure
      ansible.builtin.assert:
        that: kea_dhcp_msdns__ktpass.error | default([]) | length == 0
        fail_msg: "Keytab generation failed: {{ kea_dhcp_msdns__ktpass.error | default([]) | map(attribute='output') | list }}"
        quiet: true

    - name: Fetch the keytab to the controller
      ansible.builtin.fetch:
        src: "{{ kea_dhcp_msdns__wtmp.path }}"
        dest: "{{ kea_dhcp_msdns_keytab_dest }}"
        flat: true
  always:
    - name: Remove the keytab from the DC
      ansible.windows.win_file:
        path: "{{ kea_dhcp_msdns__wtmp.path }}"
        state: absent
      when: kea_dhcp_msdns__wtmp.path is defined

- name: Restrict the fetched keytab on the controller
  ansible.builtin.file:
    path: "{{ kea_dhcp_msdns_keytab_dest }}"
    mode: "0600"
  delegate_to: localhost
  become: false
