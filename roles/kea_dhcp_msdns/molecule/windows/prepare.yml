---
# The box's local accounts become domain accounts when it's promoted to the
# first DC of a new forest, so the connection keeps working as `vagrant`
# (PSRP + NTLM, which unlike Basic auth works for domain accounts).
- name: Promote the VM to the first DC of a new forest, with Microsoft DNS
  hosts: dc01
  gather_facts: false
  tasks:
    - name: Promote
      ansible.builtin.include_role:
        name: git_cgallagher.molecule.ad_forest
      vars:
        ad_forest_domain: "{{ lab_domain }}"
        ad_forest_netbios: "{{ lab_netbios }}"
        ad_forest_dsrm_password: "{{ lab_dsrm_password }}"
        # Kea's server principal is DNS/<hostname>.<domain>, so the DC's name is fixed.
        ad_forest_hostname: "{{ lab_hostname }}"
        # RSAT-DNS-Server provides the DnsServer module kea_dhcp_msdns uses.
        ad_forest_features: [AD-Domain-Services, DNS, RSAT-AD-PowerShell, RSAT-DNS-Server]
        ad_forest_install_dns: true
        ad_forest_ready_modules: [ActiveDirectory, DnsServer]
        # The domain zone reads ReplicationScope 'Legacy' for a minute or two
        # after promotion. Until it settles to 'Domain', Set-DnsServerPrimaryZone
        # -ReplicationScope (which win_dns_zone calls on an existing zone) fails
        # with "Failed to reset the directory partition for zone".
        ad_forest_ready_test: >-
          $zone = Get-DnsServerZone -Name '{{ lab_domain }}' -ErrorAction Stop;
          if ($zone.ReplicationScope -eq 'Legacy') { throw 'the zone is still Legacy' }
        # Kerberos tolerates 5 minutes of skew; Kea's container uses the runner's clock.
        ad_forest_sync_clock: true

    # Brownfield: the account already exists in Users without UPN or SPN, and
    # the role is pointed at an OU. Converge must find it and move it there.
    - name: Create the OU the role is pointed at
      microsoft.ad.ou:
        name: Services
        path: "DC={{ lab_domain.split('.') | join(',DC=') }}"
        state: present

    - name: Pre-create the service account in Users
      microsoft.ad.user:
        identity: kea
        name: kea
        password: "{{ lab_kea_password }}"
        update_password: on_create
        enabled: true
        state: present

    - name: Show the domain
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $d = Get-ADDomain
          [ordered]@{
              dns_root   = $d.DNSRoot
              pdc        = $d.PDCEmulator
              zones      = @(Get-DnsServerZone | ForEach-Object { $_.ZoneName })
              clock_skew = '{{ ad_forest_clock.result }} s before the correction'
              os         = (Get-CimInstance -ClassName Win32_OperatingSystem).Caption
          }
      register: lab_domain_info

    - name: Report the domain
      ansible.builtin.debug:
        var: lab_domain_info.output
