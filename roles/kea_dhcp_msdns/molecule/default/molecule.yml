---
# The AD side of kea_dhcp_dns_integration: ms-dns, against a Samba AD DC as a
# stand-in for Windows (Windows DCs can't run in CI). The kea_dhcp_msdns role
# prepares the DC (account, UPN, SPN, DnsUpdateProxy, zones, keytab), kea_dhcp
# deploys Kea on Amazon Linux 2023 x86-64, and verify proves Kerberos end to
# end: kinit with the deployed keytab, and kea-dhcp-ddns' GSS-TSIG key
# exchange with the DC. Signed record updates are proven against BIND in
# kea_dhcp_dns (Samba's own DNS server rejects them; see the role README).
platforms:
  - name: dc1
    hostname: dc1
    image: debian:12
    privileged: true   # samba-tool needs security.* xattrs
    docker_networks: &kea_ad_network
      - name: kea-ad
        ipam_config:
          - subnet: 172.29.60.0/24
            gateway: 172.29.60.1
    networks:
      - name: kea-ad
        ipv4_address: 172.29.60.10
  - name: kea-ms
    image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
    platform: linux/amd64
    docker_networks: *kea_ad_network
    networks:
      - name: kea-ad
        ipv4_address: 172.29.60.20
