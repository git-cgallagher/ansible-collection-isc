---
# Inputs: _api (base URL ending in /api), _validate_certs, _ca_path ("" = system
# trust store). Logs in with the bootstrap
# password; if that still works, sets stork_server_admin_password. A no-op once the
# password has been rotated (the bootstrap login then fails).
- name: Rotate the bootstrap admin password
  when: stork_server_admin_password | length > 0 and stork_server_admin_password != stork_server_admin_bootstrap_password
  block:
    - name: Try the bootstrap credentials
      ansible.builtin.uri:
        url: "{{ _api }}/sessions"
        method: POST
        body_format: json
        body: { authenticationMethodId: internal, identifier: "{{ stork_server_admin_user }}", secret: "{{ stork_server_admin_bootstrap_password }}" }
        validate_certs: "{{ _validate_certs }}"
        ca_path: "{{ _ca_path | default(omit, true) }}"
        status_code: [200, 400, 401, 403]
      register: _stork_server_boot_login
      until: _stork_server_boot_login.status != -1
      retries: 15
      delay: 4
      no_log: true

    - name: Set the real admin password
      ansible.builtin.uri:
        url: "{{ _api }}/users/{{ _stork_server_boot_login.json.id }}/password"
        method: PUT
        body_format: json
        body: { oldpassword: "{{ stork_server_admin_bootstrap_password }}", newpassword: "{{ stork_server_admin_password }}" }
        headers: { Cookie: "{{ _stork_server_boot_login.cookies_string }}" }
        validate_certs: "{{ _validate_certs }}"
        ca_path: "{{ _ca_path | default(omit, true) }}"
        # 400 = the password policy refused it; reported by the next task.
        status_code: [200, 400]
      register: _stork_server_set_password
      when: _stork_server_boot_login.status == 200
      changed_when: _stork_server_set_password.status == 200
      no_log: true

    # Stork's message names the unmet rules and never contains the password.
    # The default policy: 12+ characters, upper and lower case, a digit, and a
    # special character or space.
    - name: Report a refused admin password
      ansible.builtin.fail:
        msg: "Stork refused stork_server_admin_password: {{ _stork_server_set_password.json.message | default('HTTP 400') }}"
      when:
        - _stork_server_set_password is not skipped
        - _stork_server_set_password.status == 400
