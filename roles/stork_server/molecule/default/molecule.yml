---
# Stork server on Ubuntu 24.04; agents next to two Kea installs:
#   kea1 — Amazon Linux 2023, Kea 3.0, API without auth
#   kea2 — Debian 12, Kea 3.2, API basic auth via user-file/password-file
#          (the layout git_cgallagher's kea_dhcp role renders)
# Kea is installed by prepare.yml — a test fixture, not part of the collection.
platforms:
  - name: stork
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/run", "/tmp"]
    networks: [{ name: stork-molecule, ipv4_address: 172.30.20.20 }]
    published_ports: ["127.0.0.1:18090:8080/tcp"]
    docker_networks:
      - name: stork-molecule
        ipam_config: [{ subnet: 172.30.20.0/24, gateway: 172.30.20.1 }]
    groups: [stork_server]
  - name: kea1
    image: geerlingguy/docker-amazonlinux2023-ansible:latest
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/run", "/tmp"]
    networks: [{ name: stork-molecule, ipv4_address: 172.30.20.11 }]
    groups: [kea]
  - name: kea2
    image: geerlingguy/docker-debian12-ansible:latest
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/run", "/tmp"]
    networks: [{ name: stork-molecule, ipv4_address: 172.30.20.12 }]
    groups: [kea]
provisioner:
  inventory:
    host_vars:
      kea1: { test_kea_branch: "3-0", test_kea_api_auth: false, stork_agent_address: 172.30.20.11 }
      kea2: { test_kea_branch: "3-2", test_kea_api_auth: true, stork_agent_address: 172.30.20.12 }
    group_vars:
      all:
        test_admin_password: molecule-Admin-pw-1
        # The docker connection is already root. Skipping sudo avoids the
        # amd64 AL2023 image's "PAM account management error" on GitHub
        # runners (not reproducible on arm64).
        ansible_become: false
      stork_server:
        stork_server_version: "2.6.0"
        stork_server_db_password: molecule-db-pw
        stork_server_admin_password: "{{ test_admin_password }}"
      kea:
        stork_agent_version: "2.6.0"
        stork_agent_server_url: http://172.30.20.20:8080
        stork_agent_api_url: http://127.0.0.1:18090   # controller -> published port
        stork_agent_api_password: "{{ test_admin_password }}"
