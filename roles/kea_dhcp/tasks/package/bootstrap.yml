---
# Minimal images (Alpine, distroless-ish VMs) may lack Python. raw needs none.
# AL2023 minimal: /usr/bin/dnf is a symlink to microdnf (no -q), and the
# microdnf-dnf package conflicts with real dnf, so swap it before installing.
- name: Install python3 with the native package manager
  ansible.builtin.raw: >-
    command -v python3 >/dev/null 2>&1 && echo present ||
    { if command -v apk >/dev/null 2>&1; then apk add --no-cache python3;
      elif command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq python3;
      elif command -v microdnf >/dev/null 2>&1 && [ "$(readlink -f "$(command -v dnf 2>/dev/null)")" = "$(readlink -f "$(command -v microdnf)")" ]; then
        { rpm -q microdnf-dnf >/dev/null 2>&1 && microdnf -y swap microdnf-dnf dnf || microdnf -y install dnf; } && microdnf -y install python3 python3-dnf;
      elif command -v dnf >/dev/null 2>&1; then dnf install -y -q python3 python3-dnf;
      elif command -v microdnf >/dev/null 2>&1; then microdnf install -y python3 dnf python3-dnf;
      else echo "no supported package manager" >&2; exit 1; fi; echo installed; }
  register: kea_dhcp__bootstrap
  changed_when: "'installed' in kea_dhcp__bootstrap.stdout"
