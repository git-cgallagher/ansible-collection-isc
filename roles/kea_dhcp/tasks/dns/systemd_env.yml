---
# Package mode: point kea-dhcp-ddns at Kea's own krb5.conf through a systemd
# drop-in, so the host's /etc/krb5.conf (e.g. an SSSD domain join) is untouched.
- name: Create the kea-dhcp-ddns drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ kea_dhcp__services['ddns'] }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Set KRB5_CONFIG for kea-dhcp-ddns
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [Service]
      Environment=KRB5_CONFIG={{ kea_dhcp__dns.krb5_conf_path }}
    dest: "/etc/systemd/system/{{ kea_dhcp__services['ddns'] }}.service.d/kea-krb5.conf"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for Kea units
    - Restart Kea ddns
