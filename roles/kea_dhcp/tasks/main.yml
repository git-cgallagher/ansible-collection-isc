---
# Argument validation (meta/argument_specs.yml) runs automatically before this.

- name: Bootstrap Python on minimal hosts
  ansible.builtin.include_tasks: package/bootstrap.yml
  when:
    - kea_dhcp_deployment == 'package'
    - kea_dhcp_bootstrap_python | bool

- name: Gather minimal facts when the play skipped them
  ansible.builtin.setup:
    gather_subset: [min]
  when:
    - kea_dhcp_deployment == 'package'
    - ansible_facts['os_family'] is not defined

- name: Validate cross-variable constraints
  ansible.builtin.import_tasks: assert.yml

- name: Deploy from OS packages
  ansible.builtin.include_tasks: package/main.yml
  when: kea_dhcp_deployment == 'package'

- name: Deploy to Kubernetes
  ansible.builtin.include_tasks: kubernetes/main.yml
  when: kea_dhcp_deployment == 'kubernetes'
