---
# DNS integrations end to end: an MIT Kerberos KDC + BIND 9 (ns1), and two Kea
# hosts on Amazon Linux 2023 x86-64 that update it, one with GSS-TSIG
# (bind9-gss-tsig), one with a TSIG key (rfc2136). Secrets (the Kea keytab,
# the TSIG key) are generated in prepare.yml and only ever live in Molecule's
# ephemeral directory. ns1 runs at the host's native architecture.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../requirements.yml
driver:
  name: docker
platforms:
  - name: ns1
    hostname: ns1.example.test
    image: debian:12
    command: sleep infinity
    pre_build_image: true
    docker_networks: &kea_dns_network
      - name: kea-dns
        ipam_config:
          - subnet: 172.29.50.0/24
            gateway: 172.29.50.1
    networks:
      - name: kea-dns
        ipv4_address: 172.29.50.10
  - name: kea-gss
    image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
    platform: linux/amd64
    command: sleep infinity
    pre_build_image: true
    docker_networks: *kea_dns_network
    networks:
      - name: kea-dns
        ipv4_address: 172.29.50.20
  - name: kea-tsig
    image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
    platform: linux/amd64
    command: sleep infinity
    pre_build_image: true
    docker_networks: *kea_dns_network
    networks:
      - name: kea-dns
        ipv4_address: 172.29.50.21
provisioner:
  name: ansible
  env:
    # Expose this checkout as git_cgallagher.isc (see AGENTS.md).
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../.molecule-collections:${MOLECULE_PROJECT_DIRECTORY}/../../collections:~/.ansible/collections
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
