---
# Container mode (kea_dhcp_deployment: container): each test node is Amazon
# Linux 2023 running systemd and its own Docker engine, and the role runs Kea's ISC images there under
# systemd units. Nodes use the host's native architecture; the amd64 Kea
# images run through emulation where needed (kea_dhcp_container_platform).
platforms:
  - name: kea-ct30
    image: kea-container-node
    dockerfile: Dockerfile
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
    tmpfs:
      - /run
      - /tmp
  - name: kea-ct26
    image: kea-container-node
    dockerfile: Dockerfile
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
    tmpfs:
      - /run
      - /tmp
provisioner:
  inventory:
    host_vars:
      kea-ct30:
        kea_dhcp_version_series: "3.0"
      kea-ct26:
        # 2.6: the control agent shares /var/run/kea with kea-dhcp4.
        kea_dhcp_version_series: "2.6"
