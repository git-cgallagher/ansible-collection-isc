---
# Debian and Ubuntu. ISC unit names verified against isc-kea 3.0 debs
# (isc-kea-dhcp4-server.service, isc-kea-dhcp-ddns-server.service).
kea_dhcp__os_user: _kea
# Installed before any repository is added (HTTPS repos need a CA bundle).
kea_dhcp__os_prereqs: [ca-certificates]
kea_dhcp__os_packages:
  isc:
    dhcp4: [isc-kea-dhcp4]
    dhcp6: [isc-kea-dhcp6]
    ddns: [isc-kea-dhcp-ddns]
    ctrl_agent: [isc-kea-ctrl-agent]
    hooks: [isc-kea-hooks]
    mysql: [isc-kea-mysql]
    postgresql: [isc-kea-pgsql]
    admin: [isc-kea-admin]
    gss_tsig: [isc-kea-gss-tsig]
  distro:
    dhcp4: [kea-dhcp4-server]
    dhcp6: [kea-dhcp6-server]
    ddns: [kea-dhcp-ddns-server]
    ctrl_agent: [kea-ctrl-agent]
    hooks: []
    mysql: []
    postgresql: []
    admin: [kea-admin]
    gss_tsig: []
kea_dhcp__os_services:
  isc:
    dhcp4: isc-kea-dhcp4-server
    dhcp6: isc-kea-dhcp6-server
    ddns: isc-kea-dhcp-ddns-server
    ctrl_agent: isc-kea-ctrl-agent
  distro:
    dhcp4: kea-dhcp4-server
    dhcp6: kea-dhcp6-server
    ddns: kea-dhcp-ddns-server
    ctrl_agent: kea-ctrl-agent
# Kerberos client tools (kinit/klist) for kea_dhcp_dns.install_krb5_tools.
kea_dhcp__os_krb5_tools: [krb5-user]
