# Keeps the SHA-pinned actions in .github/workflows current. Dependabot updates the SHA and the
# version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Exact pins for CI's pip tools (.github/ci/requirements.txt, used as a
  # constraints file). ansible-core is ignored: its <2.22 cap moves by hand,
  # together with the sanity matrix (see the comment in that file).
  - package-ecosystem: pip
    directory: /.github/ci
    schedule:
      interval: monthly
    ignore:
      - dependency-name: ansible-core
    groups:
      ci-tools:
        patterns: ['*']
