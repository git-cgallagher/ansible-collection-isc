# Keeps the SHA-pinned actions in .github/workflows current. Dependabot updates the SHA and the
# version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # No pip ecosystem: every CI tool version comes from the ansible-runtime image
  # (RUNTIME_IMAGE in ansible-test.yml), whose Renovate bumps them.
