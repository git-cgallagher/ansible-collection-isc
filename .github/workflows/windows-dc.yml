name: windows-dc

# kea_dhcp_dns_integration: ms-dns against a real Windows Server 2022 domain
# controller (Microsoft DNS): Molecule boots the DC under QEMU/KVM on the
# runner, kea_dhcp_msdns prepares AD with its Windows backend, and Kea in an
# AL2023 x86-64 container sends GSS-TSIG signed updates to it.
#
# Manual only: it takes ~15 min and depends on a third-party box download, so
# it isn't a PR or required check. Run it after changing kea_dhcp_msdns, the
# ms-dns preset or the DDNS templates:
#   gh workflow run windows-dc.yml --repo git-cgallagher/ansible-collection-isc --ref <branch>
# For when it last passed, see the run history:
#   gh run list --workflow windows-dc.yml --repo git-cgallagher/ansible-collection-isc
# To validate a branch before this file is on main, add a temporary
# pull_request trigger (how PR #12 ran it).

on:
  workflow_dispatch:

permissions:
  contents: read

# A second dispatch on the same ref cancels the run in flight.
concurrency:
  group: windows-dc-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'
  # Stream Ansible's output instead of buffering it until the play ends.
  PYTHONUNBUFFERED: '1'
  # The driver keeps the box (~6 GB, plus ~6 GB while unpacking) and the VM
  # disk here; a failed run's screen capture and Kea log go here too. On
  # ubuntu-latest /mnt is a directory on the root filesystem, not a disk of its
  # own. The "Make room for the lab" step moves the lab when /mnt is short of
  # room.
  MOLECULE_LAB_DIR: /mnt/kea-lab

jobs:
  molecule:
    name: molecule kea_dhcp_msdns_windows
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The driver refuses to create a VM with under 20 GB free in the lab
      # directory (its windows_vm create.yml, measured with df -Pk, as here).
      # Most runners have about 85 GB free on / (145 GB, /dev/root), but some
      # come up with a 72 GB root (/dev/mapper/cow-root) and about 16 GB free
      # (git-cgallagher/ansible-collection-windows#62,
      # actions/runner-images#15238). Then this step deletes big preinstalled
      # toolchains the lab never uses (about 25 GB, in a minute or two) and
      # moves the lab to a directory on /: the same disk as /mnt today, the
      # right one if /mnt is ever a small disk of its own. The later steps read
      # the new path from ${{ env.MOLECULE_LAB_DIR }}. NEED_GB leaves margin
      # over the driver's 20 GB, part of which the image pull, apt and pip
      # below use. The lab, one VM, ends at under 8 GB (2026-11-05), so the
      # driver's check is what has to pass.
      - name: Make room for the lab
        timeout-minutes: 10
        env:
          NEED_GB: '30'
        run: |
          avail_kb() { df -Pk "$1" | awk 'NR == 2 {print $4}'; }
          gb() { awk -v kb="$1" 'BEGIN {printf "%.1f", kb / 1048576}'; }
          need_kb=$((NEED_GB * 1048576))
          lab=$MOLECULE_LAB_DIR
          df -h / /mnt
          if [ "$(avail_kb /mnt)" -lt "$need_kb" ]; then
            echo "/mnt has $(gb "$(avail_kb /mnt)") GB free, under $NEED_GB GB. Deleting from /:"
            for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /opt/hostedtoolcache/CodeQL /usr/share/swift; do
              [ -e "$dir" ] || continue
              before=$(avail_kb /)
              sudo rm -rf "$dir"
              echo "  $dir ($(gb $(($(avail_kb /) - before))) GB)"
            done
            lab=$HOME/kea-lab
            echo "MOLECULE_LAB_DIR=$lab" >> "$GITHUB_ENV"
          fi
          # The lab directory doesn't exist yet (setup-molecule creates it).
          free_kb=$(avail_kb "$(dirname "$lab")")
          echo "Lab directory: $lab, on $(df -P "$(dirname "$lab")" | awk 'NR == 2 {print $1}'), $(gb "$free_kb") GB free"
          if [ "$free_kb" -lt "$need_kb" ]; then
            echo "::warning::Only $(gb "$free_kb") GB free for the lab ($lab); it may run out of room. Re-run the job if it does."
          fi

      # Python packages and collections at the versions of the ansible-runtime image ansible-test.yml pins
      # (its constraints.txt; ansible-runtime's shared dependency model). .cache/ is gitignored.
      - name: Read the ansible-runtime image's pins
        id: runtime
        timeout-minutes: 10
        run: |
          image=$(sed -n 's/^ *RUNTIME_IMAGE: //p' .github/workflows/ansible-test.yml)
          [ -n "$image" ] || { echo "::error::RUNTIME_IMAGE not found in ansible-test.yml"; exit 1; }
          mkdir -p .cache
          docker run --rm "$image" cat /usr/share/ansible-runtime/constraints.txt > .cache/constraints.txt
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # Ansible, Molecule and the molecule-git-cgallagher driver (versions from
      # the image's constraints above), the collections (copied out of the image),
      # the git_cgallagher.molecule collection,
      # KVM + QEMU, and the lab directory (MOLECULE_LAB_DIR, see above).
      - uses: git-cgallagher/ansible-collection-molecule/.github/actions/setup-molecule@fe241402b3ecf67a343b634d39a14086ef913a50  # v0.5.0
        with:
          collection: git_cgallagher.isc
          # The collections come out of the image (every one but git_cgallagher.molecule, which
          # the action installs from its own commit), never from Galaxy. requirements.yml's
          # ranges then only check them (ansible-galaxy --offline).
          collections-image: ${{ steps.runtime.outputs.image }}
          requirements: requirements.yml
          constraints: .cache/constraints.txt
          kvm: 'true'
          lab-dir: ${{ env.MOLECULE_LAB_DIR }}

      # --destroy=never keeps the VM for the diagnostics below; the last step
      # destroys it either way. A hang must become a failure so they run.
      - name: molecule test
        timeout-minutes: 85
        working-directory: roles/kea_dhcp_msdns
        run: molecule test -s windows --destroy=never

      # What the lab used (the box image, the VM's copy-on-write disk) and the
      # room left, before destroy deletes the VM disk. QEMU pauses a VM whose
      # disk runs out of room: the screen capture below then reports
      # "VM status: paused (io-error)".
      - name: Show the lab's disk use
        if: always()
        timeout-minutes: 2
        run: |
          du -sch "$MOLECULE_LAB_DIR"/* || true
          df -h "$MOLECULE_LAB_DIR" || true

      - name: Capture the VM screen
        if: failure()
        timeout-minutes: 2
        uses: git-cgallagher/ansible-collection-molecule/.github/actions/vm-screendump@fe241402b3ecf67a343b634d39a14086ef913a50  # v0.5.0
        with:
          lab-dir: ${{ env.MOLECULE_LAB_DIR }}
          platforms: dc01

      - name: Copy the Kea log
        if: failure()
        timeout-minutes: 1
        run: docker cp kea-win:/var/log/kea-ddns-verify.log "$MOLECULE_LAB_DIR/" || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-dc-diagnostics
          path: |
            ${{ env.MOLECULE_LAB_DIR }}/dc01-screen.ppm
            ${{ env.MOLECULE_LAB_DIR }}/kea-ddns-verify.log
          if-no-files-found: ignore
          retention-days: 7

      - name: molecule destroy
        if: always()
        working-directory: roles/kea_dhcp_msdns
        run: molecule destroy -s windows
