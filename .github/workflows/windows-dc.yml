name: windows-dc

# kea_dhcp_dns_integration: ms-dns against a real Windows Server 2022 domain
# controller (Microsoft DNS): Molecule boots the DC under QEMU/KVM on the
# runner, kea_dhcp_msdns prepares AD with its Windows backend, and Kea in an
# AL2023 x86-64 container sends GSS-TSIG signed updates to it.
#
# Manual only (validated green 2026-10-28 on PR #12, run 40717463922): it takes
# ~15 min and depends on a third-party box download, so it isn't a PR or
# required check. Run it after changing kea_dhcp_msdns, the ms-dns preset or
# the DDNS templates:
#   gh workflow run windows-dc.yml --repo git-cgallagher/ansible-collection-isc --ref <branch>
# To validate a branch before this file is on main, add a temporary
# pull_request trigger (how PR #12 ran it).

on:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: windows-dc-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'
  # Stream Ansible's output instead of buffering it until the play ends.
  PYTHONUNBUFFERED: '1'
  # The runner's temp disk: the box (~6 GB, plus ~6 GB while unpacking) and
  # the VM disk don't fit on the root filesystem.
  KEA_LAB_DIR: /mnt/kea-lab

jobs:
  molecule:
    name: molecule kea_dhcp_msdns_windows
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Enable KVM and install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          ls -l /dev/kvm

      - name: Prepare the lab directory on the temp disk
        run: |
          sudo mkdir -p "$KEA_LAB_DIR"
          sudo chown "$USER" "$KEA_LAB_DIR"
          df -h "$KEA_LAB_DIR" /

      - name: Install Ansible, Molecule and the test collections
        run: |
          # molecule-plugins[docker]: Molecule loads every scenario in the role's
          # molecule/ dir, and the sibling `default` scenario uses the docker driver.
          pip install ansible-core molecule pypsrp 'molecule-plugins[docker]' docker
          ansible-galaxy collection install -r roles/kea_dhcp_msdns/molecule/windows/requirements.yml

      - name: Expose the checkout as git_cgallagher.isc
        run: |
          mkdir -p .molecule-collections/ansible_collections/git_cgallagher
          ln -sfn ../../.. .molecule-collections/ansible_collections/git_cgallagher/isc

      # --destroy=never keeps the VM for the diagnostics below; the last step
      # destroys it either way. A hang must become a failure so they run.
      - name: molecule test
        timeout-minutes: 85
        working-directory: roles/kea_dhcp_msdns
        run: molecule test -s windows --destroy=never

      # nc needs -N and a timeout: the QEMU monitor keeps the socket open.
      - name: Capture the VM screen and the Kea log
        if: failure()
        timeout-minutes: 2
        run: |
          sock="$KEA_LAB_DIR/dc01-monitor.sock"
          if [ -S "$sock" ]; then
            { printf 'screendump %s/screen.ppm\n' "$KEA_LAB_DIR"; sleep 3; } | timeout 20 nc -N -U "$sock" || true
          fi
          docker cp kea-win:/var/log/kea-ddns-verify.log "$KEA_LAB_DIR/" || true
          ls -la "$KEA_LAB_DIR" || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-dc-diagnostics
          path: |
            ${{ env.KEA_LAB_DIR }}/screen.ppm
            ${{ env.KEA_LAB_DIR }}/kea-ddns-verify.log
          if-no-files-found: ignore
          retention-days: 7

      - name: molecule destroy
        if: always()
        working-directory: roles/kea_dhcp_msdns
        run: molecule destroy -s windows
