name: argument-specs

# Every role's meta/argument_specs.yml must match its defaults, load in
# ansible-doc, and reject bad input at runtime. See tests/argument_specs/.
# No path filter: the job is a required check and must always report.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'

# Every job sets timeout-minutes: GitHub's default is 6 hours, and a stalled
# install or image pull would hold the runner that long. Each limit is several
# times the job's slowest green run (2026-11-01).
jobs:
  argument-specs:
    name: argument specs (${{ matrix.ansible }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest ansible-core the collection's CI covers.
        ansible: [stable-2.18, stable-2.21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      # Everything at the ansible-runtime image's versions (ansible-test.yml's RUNTIME_IMAGE)
      # except ansible-core, the one thing this matrix varies, and resolvelib, which only
      # ansible-core uses and whose allowed range changes with each ansible-core minor.
      - name: Install ansible-core ${{ matrix.ansible }}, the rest at the image's pins
        env:
          ANSIBLE_BRANCH: ${{ matrix.ansible }}
        run: |
          image=$(sed -n 's/^ *RUNTIME_IMAGE: //p' .github/workflows/ansible-test.yml)
          [ -n "$image" ] || { echo "::error::RUNTIME_IMAGE not found in ansible-test.yml"; exit 1; }
          docker run --rm "$image" cat /usr/share/ansible-runtime/constraints.txt \
            | grep -vE '^(ansible-core|resolvelib)==' > "$RUNNER_TEMP/constraints.txt"
          docker run --rm "$image" cat /usr/share/ansible-runtime/collections.yml > "$RUNNER_TEMP/collections.yml"
          minor="${ANSIBLE_BRANCH#stable-}"
          pip install -c "$RUNNER_TEMP/constraints.txt" "ansible-core~=${minor}.0" PyYAML
          ansible-galaxy collection install -r "$RUNNER_TEMP/collections.yml"
      - run: tests/argument_specs/run.sh
