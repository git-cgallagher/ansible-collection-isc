---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    kea_dhcp_bootstrap_python: true
    kea_dhcp_manage_service: false
    kea_dhcp_interfaces: [eth0]
    kea_dhcp_dhcp4_settings:
      subnet4:
        - id: 1
          subnet: 192.0.2.0/24
          pools: [{pool: 192.0.2.100 - 192.0.2.200}]
    kea_dhcp_dhcp6_settings:
      subnet6:
        - id: 1
          subnet: 2001:db8:1::/64
          pools: [{pool: 2001:db8:1::100 - 2001:db8:1::1ff}]
  tasks:
    - name: Apply the role from this checkout
      ansible.builtin.include_role:
        name: git_cgallagher.isc.kea_dhcp
