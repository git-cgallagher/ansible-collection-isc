---
# Heterogeneous HA trio on purpose: one hot-standby pair across two distro
# families plus a backup on a third, and a Stork server on a fourth. Proves
# the rendered config is identical everywhere and the peers interoperate.
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: stork
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/run", "/tmp"]
    networks: [{ name: kea-molecule, ipv4_address: 172.30.10.20 }]
    published_ports: ["127.0.0.1:18080:8080/tcp"]
    docker_networks:
      - name: kea-molecule
        ipam_config: [{ subnet: 172.30.10.0/24, gateway: 172.30.10.1 }]
    groups: [stork_server]
  - name: kea1
    image: geerlingguy/docker-amazonlinux2023-ansible:latest
    command: ""
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/run", "/tmp"]
    networks: [{ name: kea-molecule, ipv4_address: 172.30.10.11 }]
    groups: [kea]
  - name: kea2
    image: geerlingguy/docker-debian12-ansible:latest
    command: ""
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/run", "/tmp"]
    networks: [{ name: kea-molecule, ipv4_address: 172.30.10.12 }]
    groups: [kea]
  - name: kea3
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: ""
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/run", "/tmp"]
    networks: [{ name: kea-molecule, ipv4_address: 172.30.10.13 }]
    groups: [kea]
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    group_vars:
      all:
        stork_server_url: http://172.30.10.20:8080
        stork_api_url: http://127.0.0.1:18080   # controller -> published port
        stork_admin_password: molecule-Admin-pw-1
        stork_db_password: molecule-db-pw
        stork_version: "2.6.0"
      stork_server:
        kea_enabled: false
        stork_agent_enabled: false
        stork_server_enabled: true
      kea:
        kea_version: "3.0.4"
        kea_interfaces: [eth0]
        kea_dhcp4_socket_type: udp
        kea_ha_enabled: true
        kea_ha_mode: hot-standby
        kea_ha_heartbeat_delay: 2000
        # Test-only: no DHCP clients exist here, and with the production
        # default (5) Kea won't declare partner-down until it sees unanswered
        # clients. 0 = fail over on max-response-delay alone, so verify can
        # prove failover. Keep the defaults in production (split-brain guard).
        kea_ha_max_response_delay: 10000
        kea_ha_max_unacked_clients: 0
        kea_ha_peers:
          - { name: kea1, address: 172.30.10.11, role: primary }
          - { name: kea2, address: 172.30.10.12, role: standby }
          - { name: kea3, address: 172.30.10.13, role: backup }
        kea_dhcp4_subnets:
          - id: 1
            subnet: 172.30.10.0/24
            pools: [{ pool: 172.30.10.100 - 172.30.10.200 }]
            option-data: [{ name: routers, data: 172.30.10.1 }]
        stork_agent_address: "{{ kea_ha_peers | selectattr('name', 'eq', inventory_hostname) | map(attribute='address') | first }}"
verifier:
  name: ansible
scenario:
  test_sequence: [dependency, destroy, create, converge, idempotence, verify, destroy]
