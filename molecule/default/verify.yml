---
- name: Verify Stork sees and can talk to both Kea daemons
  hosts: stork_server
  gather_facts: false
  tasks:
    - name: The bootstrap admin/admin login is refused
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/sessions
        method: POST
        body_format: json
        body: { authenticationMethodId: internal, identifier: admin, secret: admin }
        status_code: [400, 401, 403]

    - name: Log in with the rotated password
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/sessions
        method: POST
        body_format: json
        body: { authenticationMethodId: internal, identifier: admin, secret: "{{ test_admin_password }}" }
      register: _login

    - name: Both machines are authorized (unattended registration)
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/machines?authorized=true
        headers: { Cookie: "{{ _login.cookies_string }}" }
      register: _machines
      until: _machines.json.total | default(0) == 2
      retries: 20
      delay: 3

    # Active = the agent reached the daemon's API. On kea2 that requires the
    # basic-auth credentials Stork read from the Kea config.
    - name: Both DHCPv4 daemons are active and monitored
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/daemons
        headers: { Cookie: "{{ _login.cookies_string }}" }
      register: _daemons
      until: >-
        _daemons.json['items'] | default([]) | selectattr('name', 'eq', 'dhcp4')
        | selectattr('active') | selectattr('monitored') | list | length == 2
      retries: 30
      delay: 4

    - name: Show daemons
      ansible.builtin.debug:
        msg: "{{ _daemons.json['items'] | map(attribute='label') | zip(_daemons.json['items'] | map(attribute='version')) | list }}"
