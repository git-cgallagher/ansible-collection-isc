---
# Stork server first: agents fetch the server token from it and register.
- name: Stork server
  hosts: stork_server
  become: true
  roles: [kea_stork]

- name: Kea + Stork agents
  hosts: kea
  become: true
  # One peer at a time: a config change reloads Kea; never touch both at once.
  serial: 1
  roles: [kea_stork]
