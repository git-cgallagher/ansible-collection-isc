---
# Two Kea 3.0 servers in hot-standby on Amazon Linux 2023 VMs (minimal works;
# the play installs Python first). Any supported OS works the same way.
all:
  children:
    kea:
      hosts:
        kea1: {ansible_host: 192.0.2.11}
        kea2: {ansible_host: 192.0.2.12}
      vars:
        kea_dhcp_version_series: "3.0"
        # AL2023's NIC name on EC2 Nitro; check `ip -br link` on your VMs.
        kea_dhcp_interfaces: [ens5]
        kea_dhcp_ha_enabled: true
        kea_dhcp_ha_mode: hot-standby
        kea_dhcp_ha_peers:
          - {name: kea1, role: primary}
          - {name: kea2, role: standby, auto-failover: true}
        # Peers reach each other on ansible_host:8001 (dedicated MT listener).
        kea_dhcp_dhcp4_settings:
          valid-lifetime: 7200
          option-data:
            - {name: domain-name-servers, data: "192.0.2.53"}
          subnet4:
            - id: 1
              subnet: 192.0.2.0/24
              pools: [{pool: 192.0.2.100 - 192.0.2.200}]
              option-data: [{name: routers, data: 192.0.2.1}]
              reservations:
                - {hw-address: "aa:bb:cc:dd:ee:01", ip-address: 192.0.2.20, hostname: printer}
