---
# Three Kea 3.0 VMs: primary + standby + backup (hot-standby).
#   - kea1 serves; kea2 takes over automatically if kea1 dies.
#   - kea3 receives every lease update but never serves on its own. If both
#     kea1 and kea2 are lost, promote it by hand (change its role to primary,
#     re-run the play) and it already holds the full lease database.
# Kea allows only two active servers per relationship; extra servers are backups.
# Tested by extensions/molecule/kea_dhcp_ha3 (states + a real failover).
all:
  children:
    kea:
      hosts:
        kea1: {ansible_host: 192.0.2.11}
        kea2: {ansible_host: 192.0.2.12}
        kea3: {ansible_host: 192.0.2.13}
      vars:
        kea_dhcp_version_series: "3.0"
        kea_dhcp_interfaces: [eth0]
        kea_dhcp_ha_enabled: true
        kea_dhcp_ha_mode: hot-standby
        kea_dhcp_ha_peers:
          - {name: kea1, role: primary}
          - {name: kea2, role: standby, auto-failover: true}
          - {name: kea3, role: backup}
        # Peers reach each other on ansible_host:8001 (dedicated MT listener);
        # open TCP 8001 between the three VMs.
        kea_dhcp_dhcp4_settings:
          valid-lifetime: 7200
          option-data:
            - {name: domain-name-servers, data: "192.0.2.53"}
          subnet4:
            - id: 1
              subnet: 192.0.2.0/24
              pools: [{pool: 192.0.2.100 - 192.0.2.200}]
              option-data: [{name: routers, data: 192.0.2.1}]
