---
kea_branch: "3-0"               # LTS; "3-2" = current stable
kea_version: "3.0.4"
kea_interfaces: [eth0]
kea_dhcp4_socket_type: raw      # direct clients on eth0; `udp` if relayed-only

kea_ha_enabled: true
kea_ha_mode: hot-standby
kea_ha_peers:                   # IP literals only — Kea won't resolve names here
  - { name: kea1, address: 10.0.0.11, role: primary }
  - { name: kea2, address: 10.0.0.12, role: standby }
# Recommended: mutual TLS between peers
# kea_ha_tls: { trust_anchor: /etc/kea/tls/ca.pem, cert_file: /etc/kea/tls/peer.pem, key_file: /etc/kea/tls/peer.key }
# kea_tls_files:
#   - { src: "tls/ca.pem", dest: /etc/kea/tls/ca.pem }
#   - { src: "tls/{{ inventory_hostname }}.pem", dest: /etc/kea/tls/peer.pem }
#   - { src: "tls/{{ inventory_hostname }}.key", dest: /etc/kea/tls/peer.key }

stork_agent_address: "{{ ansible_host }}"

kea_dhcp4_option_data:
  - { name: domain-name-servers, data: "10.0.0.2, 10.0.0.3" }
kea_dhcp4_subnets:
  - id: 1                       # explicit ids are required (HA peers must agree)
    subnet: 10.0.0.0/24
    pools: [{ pool: 10.0.0.100 - 10.0.0.200 }]
    option-data: [{ name: routers, data: 10.0.0.1 }]
  - id: 2                       # a relayed subnet
    subnet: 10.1.0.0/24
    pools: [{ pool: 10.1.0.50 - 10.1.0.250 }]
    relay: { ip-addresses: [10.1.0.1] }
    option-data: [{ name: routers, data: 10.1.0.1 }]
