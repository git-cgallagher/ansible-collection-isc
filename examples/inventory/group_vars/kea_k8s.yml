---
# Kubernetes: same role, same Kea variables. Switch kea_k8s_profile between
# `eks` and `talos` — nothing else has to change. See docs/kubernetes.md.
kea_deploy_mode: kubernetes
kea_k8s_profile: eks            # eks | talos | generic
kea_k8s_namespace: dhcp

kea_ha_enabled: true
kea_ha_mode: hot-standby
# Free IPs inside the cluster's SERVICE CIDR (pinned ClusterIPs):
#   EKS default 10.100.0.0/16 (or 172.20.0.0/16) · Talos default 10.96.0.0/12
kea_k8s_peers:
  - { name: kea1, cluster_ip: 10.100.200.11, role: primary }
  - { name: kea2, cluster_ip: 10.100.200.12, role: standby }

# ISC's images are amd64-only. For Graviton / ARM Talos nodes, build
# roles/kea_stork/files/Dockerfile.kea and point at it:
# kea_dhcp4_image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/kea:3.0.4
kea_k8s_node_selector: { kubernetes.io/arch: amd64 }

# Relays must send to BOTH peers' load-balancer IPs.
kea_k8s_exposure: loadbalancer
kea_k8s_lb_source_ranges: [10.0.0.0/8]
# Talos + MetalLB/Cilium: fix each peer's LB IP
# kea_k8s_lb_ips: { kea1: 192.168.10.53, kea2: 192.168.10.54 }

kea_dhcp4_subnets:              # relayed only on Kubernetes
  - id: 1
    subnet: 10.1.0.0/24
    pools: [{ pool: 10.1.0.50 - 10.1.0.250 }]
    relay: { ip-addresses: [10.1.0.1] }
    option-data: [{ name: routers, data: 10.1.0.1 }]

# Stork: sidecar agents in each Kea pod, server in-cluster on external PG.
stork_agent_enabled: true
stork_agent_image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/stork-agent:2.6.0-kea3.0.4
kea_k8s_stork_server_enabled: true
stork_server_image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/stork-server:2.6.0
stork_server_url: http://stork-server.dhcp.svc.cluster.local:8080
stork_db_host: stork.abcdefgh.us-east-1.rds.amazonaws.com
# Control node -> Stork API, for the server token (port-forward / ingress)
stork_api_url: https://stork.example.internal
