---
# VM / bare-metal example: a Kea hot-standby pair + one Stork server.
# kea_deploy_mode defaults to `package`; set `container` per host for
# distros without ISC packages (Fedora CoreOS, Flatcar, ...).
all:
  children:
    stork_server:
      hosts:
        stork1: { ansible_host: 10.0.0.20 }
    kea:
      hosts:
        kea1: { ansible_host: 10.0.0.11 }   # e.g. Amazon Linux 2023
        kea2: { ansible_host: 10.0.0.12 }   # e.g. Debian 12
    # Kubernetes deployments run from the control node only.
    kea_k8s:
      hosts:
        localhost: { ansible_connection: local }
