namespace: git_cgallagher
name: isc
version: 2.2.1
readme: README.md
authors:
  - Chris Gallagher (@git-cgallagher)
description: >-
  Deploy ISC network services: Kea DHCP (v4/v6/DDNS, HA, on hosts or
  Kubernetes), BIND 9 authoritative DNS, and the Stork monitoring server and
  agent.
license:
  - MIT
tags:
  - ddns
  - activedirectory
  - isc
  - kea
  - dhcp
  - stork
  - monitoring
  - kubernetes
  - bind
  - dns
dependencies: {}
repository: https://github.com/git-cgallagher/ansible-collection-isc
documentation: https://github.com/git-cgallagher/ansible-collection-isc#readme
issues: https://github.com/git-cgallagher/ansible-collection-isc/issues
build_ignore:
  - .github
  - .ansible
  - collections
  - roles/*/molecule
  - .molecule-collections
  - .config
  - tests
  - '*.tar.gz'
  - .ansible-lint
  - .ansible-lint-ignore
  - .yamllint
  - .gitignore
  - AGENTS.md
